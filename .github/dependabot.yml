# 依赖与 action 的自动升级通告。
# actions 升级 PR 配合 workflow 里的 commit-SHA pin 使用——Dependabot 会把 SHA pin
# 更新到新版本的 SHA，保持"版本跟进 + 完整性锚定"两全。
# 升级吸收方式：PR 当清单，本地改版本跑门禁后再合并（PR 不直接 merge）。
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Kotlin 2.x 与另一姊妹项目 Cabinet 联动缓办，不单升防工具链漂移
      - dependency-name: "org.jetbrains.kotlin*"
        versions: [">=2.0"]
      # appcompat 1.8+ / material 1.14+ 传递 kotlin-stdlib 2.1，与 1.9.24 编译器
      # 不兼容（实测编译失败退回）——随 Kotlin 2.x 联动专项解禁
      - dependency-name: "androidx.appcompat*"
        versions: [">=1.8"]
      - dependency-name: "com.google.android.material*"
        versions: [">=1.14"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
