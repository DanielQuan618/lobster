# 稳定版构建（fork 版）：仅 workflow_dispatch 手动触发（本 fork 默认不在打 tag 时自动出包，
# 避免无签名密钥时把 debug 签名包装进 Release；需要自动出包可自行恢复 push.tags 触发）。
# 本 fork 与上游使用同一套构建链，但做了两处 fork 化处理：
#   ① 版权物（ONNX 模型/桔库）默认不注入——本仓没有上游的 assets 预发布资产时自动跳过，
#      构建照常进行（运行期自动回退 YOLO / 纯引擎模式）；
#   ② 签名密钥默认不注入——Secrets 未配置时回退 debug 签名，仅用于编译验证/自用；
#      正式分发请配置自有密钥 Secrets（ANDROID_KEYSTORE_B64 / ANDROID_STORE_PWD /
#      ANDROID_KEY_PWD），并可另配 APK_CERT_SHA256 启用证书指纹门禁。
# 安全基线：所有第三方 action pin 到完整 commit SHA（防上游 tag 劫持）。
name: Build-Lobster

on:
  workflow_dispatch: {} # 手动补包：只挂 artifact；若在 tag 上手动运行则附挂同名 Release

permissions:
  contents: write # tag 触发时向 Release 上传产物需要

# 产物名内嵌日期（app/build.gradle.kts 用 SimpleDateFormat 取 JVM 本地时区）：
# runner 是 UTC，不设 TZ 产物日期会比北京时间早一天
env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # versionCode = git 提交数（app/build.gradle.kts 的 gitCommitCount），需要完整历史
    - name: checkout codes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: '0'

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 版权物注入（可选）：ONNX 模型文件名硬编码于 OnnxBoardRecognizer.kt，桔库文件名
    # 硬编码于 BHDatabase.java。若本仓存在名为 assets 的预发布 Release（把版权物作为
    # assets 上传，不入 git），则下载注入；否则跳过，构建照常（运行期自动回退）。
    - name: 下载版权物资产注入 assets（可选）
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        gh release view assets --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
        if [ $? -ne 0 ]; then
          echo "本仓未配置 assets 预发布资产，跳过注入（构建将回退 YOLO / 纯引擎模式）"
          exit 0
        fi
        mkdir -p app/src/main/assets/models app/src/main/assets/databases
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "4_v6-0301.onnx" --dir app/src/main/assets/models --clobber
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "nano_v3-0319.onnx" --dir app/src/main/assets/models --clobber
        gh release download assets --repo "$GITHUB_REPOSITORY" \
          --pattern "Lobster-obk.zip" --dir app/src/main/assets/databases --clobber
        mv app/src/main/assets/databases/Lobster-obk.zip \
           "app/src/main/assets/databases/桔库09.09.2023精修库.obk.zip"

    # 资产自检：仅在确实注入资产时校验 sha256 完整性
    - name: 资产自检（有资产时）
      if: hashFiles('app/src/main/assets/models/4_v6-0301.onnx') != ''
      run: |
        cd app/src/main/assets
        echo "fbd895d40ab81b41b8188f881866485678b7871775821aa50cfe74004a1dc796  models/4_v6-0301.onnx" | sha256sum -c -
        echo "cb1c1eb93370cb9c6bd65bc8a8b0f5ddc8dbc34cfc83ca902c447960b6ef7e3c  models/nano_v3-0319.onnx" | sha256sum -c -
        echo "e7403a1e2efeeaa0a60de5905135b53865f3d37157e65c4fff4d25aadec48942  databases/桔库09.09.2023精修库.obk.zip" | sha256sum -c -
        ls -la models databases

    # runner 预装 SDK 未必含 compileSdk 34 与钉定的 NDK 25.1，先接受 license
    # 让 gradle/sdkmanager 自动补装
    - name: Accept SDK licenses
      run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

    # 签名密钥注入（可选）：密钥 base64 与双密码存于仓库 Secrets。未配置时跳过注入，
    # 构建自动回退 debug 签名（保证可构建；正式分发请自行配置自有密钥）。
    - name: 注入 release 签名密钥（可选）
      continue-on-error: true
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        STORE_PWD: ${{ secrets.ANDROID_STORE_PWD }}
        KEY_PWD: ${{ secrets.ANDROID_KEY_PWD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/cchess.release.2026.jks
          printf 'CCHES_STORE_PWD=%s\nCCHES_KEY_PWD=%s\n' "$STORE_PWD" "$KEY_PWD" > local.properties
          echo "release 签名密钥已注入（真签构建）"
        else
          echo "::warning::未配置签名 Secrets，本次构建回退 debug 签名"
        fi

    - name: Unit tests
      run: bash gradlew :app:testArmv8-dotprodDebugUnitTest --no-daemon --console=plain

    - name: Assemble Release APKs
      run: bash gradlew assembleArmv8Release assembleArmv8-dotprodRelease --no-daemon --console=plain

    - name: Collect APKs
      run: |
        mkdir -p dist
        find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
        ls -l dist

    # 证书指纹门禁（可选）：配置了 APK_CERT_SHA256 才启用；用于确保 Release 包
    # 由指定自有密钥签名，防止 debug 签名包混入正式 Release。
    - name: 签名指纹门禁（配置 APK_CERT_SHA256 时）
      if: startsWith(github.ref, 'refs/tags/') && env.APK_CERT_SHA256 != ''
      env:
        APK_CERT_SHA256: ${{ secrets.APK_CERT_SHA256 }}
      run: |
        APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        FAIL=0
        for apk in dist/*-release.apk; do
          GOT=$("$APKSIGNER" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/{print tolower($NF)}')
          echo "$apk -> $GOT"
          if [ "$GOT" != "$APK_CERT_SHA256" ]; then
            echo "::error::签名指纹不符（预期自有密钥）：$apk"
            FAIL=1
          fi
        done
        exit $FAIL

    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: Lobster-apks
        path: dist/*.apk

    # tag（v* 语义化版本）触发时挂到同名 Release：没有则创建，已有则补挂资产
    - name: Attach to Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: dist/*.apk
        body: |
          稳定版自动构建（tag：${{ github.ref_name }}）。versionCode = git 提交数，版本名与构建配置见 `app/build.gradle.kts`。

          - `*_armv8-dotprod-release.apk`：推荐变体，需 ARMv8.2 dotprod 指令集（骁龙855 / 麒麟990 / 天玑1000 及以上）
          - `*_armv8-release.apk`：兼容变体，供不支持 dotprod 的老机器

          > **签名说明**：这是本 fork 的构建产物，**不使用上游项目的签名密钥**；若构建时
          > 未配置自有签名 Secrets，则为 debug 签名（仅供测试，不能覆盖安装其他来源的包）。
          > 详见 [README](https://github.com/DanielQuan618/lobster#获取渠道与签名核验)。
